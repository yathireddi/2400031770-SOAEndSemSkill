// Gradle build file (used instead of pom.xml)
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Spring Cloud version that matches Spring Boot 3.3.x
ext {
    set('springCloudVersion', '2023.0.3')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // REST controllers
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // JPA / Hibernate to talk to the database container
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Eureka client to register with the discovery server
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // PostgreSQL JDBC driver (app-db container)
    runtimeOnly 'org.postgresql:postgresql'
}

// Build only the executable (boot) jar, not the plain jar
jar {
    enabled = false
}

# ---- app-service configuration ----
spring.application.name=app-service
server.port=8081

# ---- Database (app-db container) ----
# "app-db" is the docker-compose service name = hostname inside the Docker network.
# For local runs without Docker, change app-db to localhost.
# (These values are overridden by environment variables in docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/appdb
spring.datasource.username=appuser
spring.datasource.password=apppass
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Eureka client ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

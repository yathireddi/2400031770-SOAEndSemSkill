# ---- API Gateway configuration ----
spring.application.name=api-gateway
server.port=8080

# Eureka location (overridden by docker-compose environment variable)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- Route definition ----
# Any request with path /api/** goes to the service registered as "app-service"
# "lb://" means: look the service up in Eureka and load-balance across instances
spring.cloud.gateway.routes[0].id=app-service-route
spring.cloud.gateway.routes[0].uri=lb://app-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**
